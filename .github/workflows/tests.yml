name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    # Runs on public repositories; a private fork skips the job.
    if: ${{ !github.event.repository.private }}
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install PyTorch (CPU build of the version install.bat installs)
        run: python -m pip install torch==2.14.1 torchvision==0.29.1 torchaudio==2.11.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Install dependencies
        run: python -m pip install -r requirements.txt opencv-python==5.0.0.93 mediapipe==1.1.1 protobuf==7.36.2 accelerate==1.15.0
      - name: Unit tests (no GPU, no models)
        run: python -m unittest discover -s tests -v
