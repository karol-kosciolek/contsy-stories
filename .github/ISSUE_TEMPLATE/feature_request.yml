name: Feature request
description: Suggest an improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe the result you want, not only the feature.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Anything else?
      description: Features that weaken the refusal of text combining minors with sexual content, or the adult-age check of characters' reference photos, are not accepted (see CONTRIBUTING.md).
